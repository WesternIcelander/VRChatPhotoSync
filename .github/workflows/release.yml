# Builds, tests and publishes VRChatPhotoSync.exe when a version tag (v*) is pushed,
# then attaches the exe to a GitHub release for that tag.
#
# The version comes from <Version> in src/VRChatPhotoSync/VRChatPhotoSync.csproj; the tag
# must be "v" + that version (for example v0.1.0), or the run fails before building.
# Integration tests talk to a real Immich server only when the repository secrets
# IMMICH_TEST_URL and IMMICH_TEST_API_KEY are set; without them they are skipped.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml]$csproj = Get-Content 'src/VRChatPhotoSync/VRChatPhotoSync.csproj'
          $version = ($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if (-not $version) { throw 'No <Version> in VRChatPhotoSync.csproj.' }
          if ($env:TAG -ne "v$version") {
            throw "Tag '$($env:TAG)' doesn't match the project version '$version'. Update <Version> or tag v$version."
          }
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build VRChatPhotoSync.sln -c Release

      - name: Test
        env:
          IMMICH_TEST_URL: ${{ secrets.IMMICH_TEST_URL }}
          IMMICH_TEST_API_KEY: ${{ secrets.IMMICH_TEST_API_KEY }}
        run: dotnet test VRChatPhotoSync.sln -c Release --no-build

      - name: Publish
        run: ./tools/publish.ps1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $flags = @('--title', $env:TAG, '--generate-notes', '--verify-tag')
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG 'publish/VRChatPhotoSync.exe' @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit code $LASTEXITCODE)." }
